name: Release

# Runs on every push to main, but only releases when manifest.json has a version
# that has no GitHub Release yet. To release: bump "version" in a PR and merge it.
#
# Signs the add-on as unlisted (self-distributed) and publishes a GitHub Release
# with the signed .xpi and updates.json. Installed copies find new versions
# through the manifest's update_url, which points at the latest release's
# updates.json.
#
# Needs repository secrets AMO_API_KEY (JWT issuer) and AMO_API_SECRET
# (https://addons.mozilla.org/developers/addon/api/key/).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # test/run.sh uses macOS's JavaScriptCore via osascript.
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Is this version new?
        id: version
        run: |
          read -r id version < <(python3 -c "import json; m = json.load(open('manifest.json')); print(m['browser_specific_settings']['gecko']['id'], m['version'])")
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.new == 'true'
        run: test/run.sh

      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Lint
        if: steps.version.outputs.new == 'true'
        run: npx --yes web-ext@10 lint --self-hosted --ignore-files "test/**" "tools/**"

      - name: Sign
        if: steps.version.outputs.new == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: >
          npx --yes web-ext@10 sign
          --channel unlisted
          --ignore-files "test/**" "tools/**"
          --artifacts-dir web-ext-artifacts

      - name: Write updates.json
        if: steps.version.outputs.new == 'true'
        env:
          ID: ${{ steps.version.outputs.id }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          xpi="twitch-block-delta-$VERSION.xpi"
          mv web-ext-artifacts/*.xpi "dist/$xpi"
          hash=$(shasum -a 256 "dist/$xpi" | cut -d' ' -f1)
          link="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$xpi"
          python3 - "$ID" "$VERSION" "$link" "$hash" > dist/updates.json <<'PY'
          import json, sys
          addon_id, version, link, digest = sys.argv[1:]
          update = {"version": version, "update_link": link, "update_hash": f"sha256:{digest}"}
          print(json.dumps({"addons": {addon_id: {"updates": [update]}}}, indent=2))
          PY
          cat dist/updates.json

      - name: Publish the GitHub Release
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes --latest
