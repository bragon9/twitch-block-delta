name: Release

# Runs on every push to main, but only releases when manifest.json has a version
# that has no GitHub Release yet. To release: bump "version" in a PR and merge it.
#
# Submits the add-on to addons.mozilla.org (AMO) as a listed version and
# publishes a GitHub Release for it. AMO reviews the version before it can be
# downloaded, so the release starts without an .xpi; the "Attach AMO build"
# workflow adds it once AMO approves. The listing text comes from
# amo/metadata.json.
#
# Needs repository secrets AMO_API_KEY (JWT issuer) and AMO_API_SECRET
# (https://addons.mozilla.org/developers/addon/api/key/).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # test/run.sh uses macOS's JavaScriptCore via osascript.
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Is this version new?
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.new == 'true'
        run: test/run.sh

      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Lint
        if: steps.version.outputs.new == 'true'
        run: npx --yes web-ext@10 lint --ignore-files "test/**" "tools/**" "amo/**"

      - name: Submit to AMO
        if: steps.version.outputs.new == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        # --approval-timeout 0: submit and return; review can take days.
        run: >
          npx --yes web-ext@10 sign
          --channel listed
          --amo-metadata amo/metadata.json
          --approval-timeout 0
          --ignore-files "test/**" "tools/**" "amo/**"

      - name: Publish the GitHub Release
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes --latest
