name: Test

# Gates merges into main. The Release workflow re-runs the tests before signing.
on:
  pull_request:

jobs:
  test:
    # test/run.sh uses macOS's JavaScriptCore via osascript.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: test/run.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx --yes web-ext@10 lint --self-hosted --ignore-files "test/**" "tools/**"
