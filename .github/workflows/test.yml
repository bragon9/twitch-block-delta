name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # test/run.sh uses macOS's JavaScriptCore via osascript.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: test/run.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes web-ext@8 lint --self-hosted --ignore-files "test/**" "tools/**"
