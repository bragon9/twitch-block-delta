<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon.svg" width="28" height="28" alt="" />
      <strong>Twitch Block Delta</strong>
      <span id="version" class="muted"></span>
      <button id="settings" class="icon-button" title="Settings" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path
            fill="currentColor"
            d="M6.9.5h2.2l.4 2a5.5 5.5 0 0 1 1.3.75l1.9-.7 1.1 1.9-1.55 1.3a5.6 5.6 0 0 1 0 1.5l1.55 1.3-1.1 1.9-1.9-.7a5.5 5.5 0 0 1-1.3.75l-.4 2H6.9l-.4-2a5.5 5.5 0 0 1-1.3-.75l-1.9.7-1.1-1.9 1.55-1.3a5.6 5.6 0 0 1 0-1.5L2.2 4.45l1.1-1.9 1.9.7a5.5 5.5 0 0 1 1.3-.75zM8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"
          />
        </svg>
      </button>
    </header>
    <div id="status" class="status" hidden></div>
    <section id="stream" class="card"></section>
    <details id="troubleshooting">
      <summary>Troubleshooting</summary>
      <div id="tab-detail" class="scroll"></div>
      <div class="actions">
        <button id="report">Report a problem</button>
      </div>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
