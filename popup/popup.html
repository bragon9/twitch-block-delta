<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon.svg" width="28" height="28" alt="" />
      <strong>Twitch Block Delta</strong>
      <span id="version" class="muted"></span>
    </header>
    <div id="status" class="status"></div>
    <div id="tabs"></div>
    <details id="details">
      <summary>Details &amp; logging</summary>
      <div class="field">
        <span class="label" id="mode-label">Mode</span>
        <div class="mode" role="radiogroup" aria-labelledby="mode-label">
          <button id="mode-block" role="radio">Block</button>
          <button id="mode-observe" role="radio">Observe only</button>
        </div>
      </div>
      <div class="field">
        <div class="row">
          <label class="label" for="log-mode">Logging</label>
          <select id="log-mode">
            <option value="off">Off</option>
            <option value="problems">Problems only</option>
            <option value="always">Always</option>
          </select>
        </div>
        <p id="log-note" class="muted small"></p>
      </div>
      <div id="tab-details"></div>
      <p id="summary" class="muted small"></p>
      <div class="actions">
        <button id="dump" class="primary">Save recent</button>
        <button id="export">Export captures</button>
        <button id="clear">Clear</button>
      </div>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
